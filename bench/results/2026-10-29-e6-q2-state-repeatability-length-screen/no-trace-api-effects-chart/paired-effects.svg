<text x="350" y="32" class="title">No-staging Q2_0 API screen: paired NInfer effect</text>
<text x="350" y="57" class="sub">Three randomized process pairs per workload; candidate / Strata change in percent; positive TPS is faster and positive latency is slower</text>
<text x="350" y="78" class="sub">Bootstrap intervals use whole paired blocks (screening only); output matched within each pair; no independent task-quality oracle</text>
<text x="350" y="99" class="small">Small circles: individual paired blocks; diamond: paired median; horizontal line: paired bootstrap 95% interval</text>
